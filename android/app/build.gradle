plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.thj.mscanner"
    compileSdk 36 // ✅ 직접 설정하여 명확히 표시
    ndkVersion "28.2.13676358"   // ✅ r28 명시 고정

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // ✅ Java 17로 변경
        targetCompatibility JavaVersion.VERSION_17 // ✅ Java 17로 변경
    }
    kotlinOptions {
        jvmTarget = "17" // ✅ Kotlin도 Java 17 타겟
    }

    defaultConfig {
        applicationId "com.thj.mscanner"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36 // ✅ 직접 설정하여 명확히 표시
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def properties = new Properties()
            properties.load(new FileInputStream(file("keystore.properties")))

            storeFile file(properties["key.store.file"])
            storePassword properties["key.store.password"]
            keyAlias properties["key.alias.name"]
            keyPassword properties["key.alias.password"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'


        }
        debug {
            minifyEnabled false
        }
    }


}

flutter {
    source "../.."
}

dependencies {
    implementation 'androidx.core:core:1.18.0'

    implementation "androidx.work:work-runtime:2.11.2"
    
    implementation 'com.android.billingclient:billing:6.1.0' // 최신 버전
    implementation "com.android.billingclient:billing-ktx:6.1.0"
}
tasks.register("printNdk") {
    doLast {
        println ">>> Using ndkVersion = ${android.ndkVersion}"
    }
}

configurations.configureEach {
    resolutionStrategy {
        dependencySubstitution {
            substitute(module("com.mapbox.maps:android")).using(module("com.mapbox.maps:android-ndk27:11.14.0"))
        }
    }
}
