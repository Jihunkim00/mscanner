dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  intl_translation: ^0.21.0


flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/home_icon.png
    - assets/images/camera_icon.png
    - assets/images/history_icon.png
    - assets/images/settings_icon.png
    - assets/images/logo.png
    - assets/images/
    - assets/map_styles/dark_mode.json
    - assets/images/help_icon_light.png
    - assets/images/help_icon_dark.png
    - assets/images/manual_dark.png
    - assets/images/manual_light.png
    - assets/images/tutorial_sample.jpg
    - assets/mapbox_terrain.html
    - assets/images/icon.png
    - assets/images/m_zoomout_pin.png
    - assets/images/admscanner.png
    - assets/icons/aifood.png
    - assets/images/login_header.png
    - assets/images/tittle.png
    - assets/images/apple_light.png
    - assets/images/apple_dark.png
    - assets/images/google_light.png
    - assets/images/google_dark.png
    - assets/images/guest_welcome.png




    - assets/fonts/SF-Pro.ttf
    - assets/fonts/SF-Pro-Display-Bold.otf
    - assets/fonts/SF-Pro-Italic.ttf

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro.ttf
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Italic.ttf
          style: italic
        - asset: assets/fonts/SF-Pro-text-black.otf
          weight: 900