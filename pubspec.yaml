name: mscanner
description: "mscanner by thj."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.3.28+141

environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  path_provider: ^2.1.5
