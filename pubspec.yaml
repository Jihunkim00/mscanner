  google_maps_flutter: ^2.13.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  introduction_screen: ^3.1.14
  flutter_image_compress: ^2.4.0
  share_plus: ^10.1.3
  getwidget: ^7.0.0
