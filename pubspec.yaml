  flutter_custom_tabs: ^2.4.0
  dart_geohash: ^2.1.0
  translator: ^1.0.3+1
  in_app_purchase: ^3.2.3
  provider: ^6.1.5
  image: ^4.5.4
  mapbox_maps_flutter: ^2.12.0
  firebase_auth: ^6.1.0
  google_sign_in_android: ^7.2.1
  phosphor_flutter: ^2.1.0
  cloud_functions: ^6.0.6
  crypto: ^3.0.7
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1


dependency_overrides:
